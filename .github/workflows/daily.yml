name: Oila hikmati

on:
  schedule:
    # Har kuni Toshkent vaqti bilan 07:00, 12:00 va 19:00 da (UTC 02:00, 07:00, 14:00).
    # GitHub ba'zan bir necha daqiqa kechiktirishi mumkin.
    - cron: "0 2,7,14 * * *"
  workflow_dispatch: {}   # "Run workflow" tugmasi bilan qo'lda sinash uchun

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Oila hikmatini yuborish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
